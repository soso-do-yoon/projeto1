<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login OAuth</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-top: 0; }
    .btn {
      display: block;
      box-sizing: border-box;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #d1d5db;
      color: #111;
      background: #fff;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    .btn:hover { background: #f9fafb; }
    .github { background: #24292f; color: #fff; border-color: #24292f; }
    .github:hover { background: #32383f; }
    .sair { background: #fee2e2; border-color: #fca5a5; color: #991b1b; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login OAuth</h1>
    <p id="status">Verificando sessão...</p>

    <div id="deslogado" hidden>
      <a class="btn" href="/oauth/login/google">Entrar com Google</a>
      <a class="btn github" href="/oauth/login/github">Entrar com GitHub</a>
    </div>

    <div id="logado" hidden>
      <p>Olá, <strong id="nome"></strong></p>
      <p>E-mail: <span id="email"></span></p>
      <p>Via: <span id="issuer"></span></p>
      <form method="POST" action="/oauth/logout">
        <button class="btn sair" type="submit">Sair</button>
      </form>
    </div>
  </div>

  <script>
    fetch("/api/me")
      .then((r) => r.json())
      .then((dados) => {
        document.getElementById("status").hidden = true;
        if (dados.authenticated) {
          document.getElementById("nome").textContent = dados.displayName || "-";
          document.getElementById("email").textContent = dados.email || "-";
          document.getElementById("issuer").textContent = dados.issuer;
          document.getElementById("logado").hidden = false;
        } else {
          document.getElementById("deslogado").hidden = false;
        }
      })
      .catch(() => {
        document.getElementById("status").textContent = "Erro ao verificar a sessão.";
      });
  </script>
</body>
</html>
